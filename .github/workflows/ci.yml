name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p comic-core -p comic-engines -p comic-cli -- -D warnings
      - name: test
        run: cargo test -p comic-core -p comic-engines -- --nocapture
