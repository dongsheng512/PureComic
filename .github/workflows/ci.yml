name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p comic-core -p comic-engines -p comic-cli --all-targets -- -D warnings
      - name: test
        run: cargo test -p comic-core -p comic-engines -p comic-cli

  tauri-app:
    name: tauri app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tauri-build 要求 conf 里的 sidecar / resources 路径存在；CI 不下载真实引擎。
      - name: stub sidecar and resources
        run: |
          BIN=apps/desktop/src-tauri/binaries
          RES=apps/desktop/src-tauri/resources
          mkdir -p "$BIN" \
            "$RES/models-cunet" "$RES/models-se" "$RES/models-pro" "$RES/models-nose" \
            "$RES/waifu2x-coreml" "$RES/realesrgan-coreml"
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            : > "$BIN/waifu2x-ncnn-vulkan-$triple"
            : > "$BIN/realcugan-ncnn-vulkan-$triple"
          done
          : > "$RES/NOTICE"
          : > "$RES/checksums.sha256"
      - name: clippy
        run: cargo clippy -p purecomic --all-targets -- -D warnings
      - name: build
        run: cargo build -p purecomic

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: install
        working-directory: apps/desktop
        run: npm ci
      - name: lint
        working-directory: apps/desktop
        run: npm run lint
      - name: typecheck + build
        working-directory: apps/desktop
        run: npm run build
