[workspace]
resolver = "2"
members = [
    "crates/comic-core",
    "crates/comic-engines",
    "crates/comic-cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/comic-core",
    "crates/comic-engines",
    "crates/comic-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["PureComic contributors"]
repository = "https://github.com/dongsheng512/PureComic"

[workspace.dependencies]
comic-core = { path = "crates/comic-core" }
comic-engines = { path = "crates/comic-engines" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
regex = "1"
clap = { version = "4", features = ["derive"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
tempfile = "3"
base64 = "0.22"
mobi = "0.8"
libc = "0.2"
rayon = "1.10"
num_cpus = "1.16"

[profile.release]
lto = true
codegen-units = 1
strip = true
# 桌面应用无需 unwind 语义（无 catch_unwind 使用），减小体积
panic = "abort"

# dev 下图像解码/编码热路径太慢，给自身 crate 开优化
[profile.dev.package.comic-core]
opt-level = 1

[profile.dev.package.comic-engines]
opt-level = 1

[profile.dev.package.comic-cli]
opt-level = 1
